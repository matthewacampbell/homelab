apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/matthewacampbell/homelab.git
        revision: master
        directories:
          - path: "*"
          - path: cilium
            exclude: true
          - path: argocd
            exclude: true
          - path: deploments
            exclude: true
          - path: metallb
            exclude: true
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/matthewacampbell/homelab.git
        targetRevision: master
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
