apiVersion: apps/v1
kind: DaemonSet
metadata: {name: longhorn-wipe, namespace: kube-system}
spec:
  selector: {matchLabels: {app: longhorn-wipe}}
  template:
    metadata: {labels: {app: longhorn-wipe}}
    spec:
      tolerations: [{operator: Exists}]
      containers:
      - name: wipe
        image: busybox:1.36
        command: ["sh", "-c", "rm -rf /data/* && echo WIPED && sleep 3600"]
        securityContext: {privileged: true}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, hostPath: {path: /var/lib/longhorn}}]
